# cargo-deny policy: `cargo deny check advisories bans licenses sources`.

[advisories]
yanked = "deny"
ignore = [
  # Unmaintained, pulled in only by Tauri's Linux GTK3 bindings (glib-macros); no fix available.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk3 stack; unmaintained, no vulnerability" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  # ring, rustls-webpki, untrusted (the updater's TLS stack) and libloading.
  "ISC",
  # webpki-root-certs: the Mozilla root certificates as data.
  "CDLA-Permissive-2.0",
  # Our own workspace crate.
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
