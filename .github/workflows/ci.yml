name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - name: Build binary for this platform
        run: bun run build
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=$(ls dist/harness-dashboard-* | head -n1)
          "$BIN" version
          "$BIN" --help
