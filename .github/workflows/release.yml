name: Release

# Every push to main is analysed by semantic-release. Conventional commits decide the next version:
#   fix: → patch, feat: → minor, "BREAKING CHANGE:" footer or "feat!:" → major; other types don't release.
# On a release it bumps package.json, updates CHANGELOG.md, builds all binaries with that version,
# tags vX.Y.Z and publishes a GitHub release with the binaries + checksums.txt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the release commit + tag, create the release
  id-token: write # sign the build provenance attestations
  attestations: write # store them, for `gh attestation verify`

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  release:
    needs: test
    # macOS can cross-compile every target and natively ad-hoc sign the darwin binaries.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
      # Signed provenance for every binary: proof it was built here, from this commit. Only when a release was made.
      - name: Attest build provenance
        if: hashFiles('dist/checksums.txt') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/harness-dashboard-*
            dist/checksums.txt
