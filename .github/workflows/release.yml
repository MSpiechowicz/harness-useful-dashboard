name: Release

# After CI succeeds on main, semantic-release analyses the Conventional Commits since the last tag.
# fix: -> patch, feat: -> minor, "BREAKING CHANGE:" footer or "feat!:" -> major, other types do not release.
# On a release it bumps package.json/Cargo.toml/Cargo.lock, updates CHANGELOG.md, pushes the release commit and
# the vX.Y.Z tag and creates a DRAFT GitHub release. The bundle job then builds the app installers on every OS and
# uploads them (plus latest.json for the updater and the plain CLI binary) to that draft. The publish job
# writes checksums.txt, attests every asset and finally un-drafts the release.
# See docs/release-and-updater-keys.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Releases run one at a time and are never cancelled half-way (a cancelled run could leave a tag without bundles).
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Version and draft release
    # Only releases from main: CI must have passed for a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the draft release
    outputs:
      # Written by the exec plugin's successCmd (see .releaserc.json). Empty when nothing was released.
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The commit CI validated. If main has moved on since, semantic-release sees a stale
          # branch and does nothing, the newer push gets its own run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN itself
      # Runs before any tag exists: a release without the updater public key and its signing secret would
      # install fine but could never update. Only whether the secret is set reaches this step, never its value.
      - name: Check the updater key is configured
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          if [[ -z "$pubkey" || "$pubkey" == NOT_CONFIGURED* ]]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. See docs/release-and-updater-keys.md."
            exit 1
          fi
          # The key is stored base64 encoded: it has to decode to the text of a minisign public key.
          if ! printf '%s' "$pubkey" | base64 -d 2>/dev/null | grep -q 'minisign public key'; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is not a base64 encoded minisign public key. See docs/release-and-updater-keys.md."
            exit 1
          fi
          if [[ "$HAS_SIGNING_KEY" != 'true' ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/release-and-updater-keys.md."
            exit 1
          fi
      # semantic-release is a Node program (it needs Node >= 22.14), bunx runs it through `node`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the draft release
    strategy:
      fail-fast: false
      matrix:
        # triple: the Rust target triple. The sidecar build names its binary after it, and the plain CLI release asset
        # harness-dashboard-cli-<triple> is a copy of that binary.
        # target: only where the build is cross-compiled (both macOS builds run on the same arm64 runner).
        include:
          - name: Linux x64 (AppImage, deb, rpm)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            # The tray library is loaded at runtime, so linuxdeploy can't see it: the extra config ships it (and,
            # through it, dbusmenu) in the AppImage, built against the GLib the AppImage bundles. Without it the
            # host's copy is loaded, which needs a newer GLib and crashes the app on current distributions.
            args: --bundles appimage,deb,rpm --config src-tauri/tauri.appimage.conf.json
          - name: Linux arm64 (AppImage, deb, rpm)
            os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            # Same as x64, with the arm64 library path.
            args: --bundles appimage,deb,rpm --config src-tauri/tauri.appimage.arm64.conf.json
          - name: macOS arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS x64
            os: macos-latest
            triple: x86_64-apple-darwin
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64 (NSIS, MSI)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.release.outputs.version }} # the tag carries the bumped manifests
          persist-credentials: false
      - name: Install Linux system libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.triple }}
          # The cache key ignores [profile.release], and an exact hit is never re-saved: bump this whenever the
          # profile changes, or every release rebuilds all dependencies from a cache built with the old settings.
          prefix-key: v1-release-profile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # tauri's beforeBuildCommand (`bun run build:sidecar`) compiles the server for the build's target triple into
      # src-tauri/binaries/harness-dashboard-<triple>, and the bundles embed that binary.
      - name: Build bundles and upload to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (not the OS installers). See docs/release-and-updater-keys.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # The same binary the app ships as its sidecar, as a plain download for people who want only the command line.
      - name: Upload the CLI binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          src="src-tauri/binaries/harness-dashboard-${TRIPLE}${ext}"
          asset="cli-asset/harness-dashboard-cli-${TRIPLE}${ext}"
          test -s "$src" || { echo "::error::$src is missing, the sidecar build did not run"; exit 1; }
          mkdir -p cli-asset
          cp "$src" "$asset"
          gh release upload "v$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish release
    needs: [release, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write # un-draft the release
      id-token: write # sign the build provenance attestations
      attestations: write # store them, for `gh attestation verify`
    steps:
      # Each bundle job merges its platforms into latest.json (read, delete, re-upload), so two jobs finishing
      # together can drop each other's entries. A platform missing from the manifest could never update, so the
      # release stays a draft until it is complete: re-run the failed platform's bundle job, then this job.
      - name: Check latest.json lists every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          manifest="$RUNNER_TEMP/latest.json"
          if ! jq -e --arg version "$VERSION" '(.version | ltrimstr("v")) == $version' "$manifest" > /dev/null; then
            echo "::error::latest.json does not announce version $VERSION"
            exit 1
          fi
          missing=0
          for platform in \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm \
            linux-aarch64 linux-aarch64-appimage linux-aarch64-deb linux-aarch64-rpm \
            darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app \
            windows-x86_64 windows-x86_64-nsis windows-x86_64-msi; do
            if ! jq -e --arg platform "$platform" '.platforms[$platform] | ((.url // "") | startswith("https://")) and ((.signature // "") | length > 0)' "$manifest" > /dev/null; then
              echo "::error::latest.json has no usable entry for $platform"
              missing=1
            fi
          done
          exit "$missing"
      # The plain CLI binaries are uploaded outside tauri-action, so they are checked here.
      - name: Check every CLI binary is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/names.txt"
          missing=0
          for asset in \
            harness-dashboard-cli-x86_64-unknown-linux-gnu harness-dashboard-cli-aarch64-unknown-linux-gnu \
            harness-dashboard-cli-x86_64-apple-darwin harness-dashboard-cli-aarch64-apple-darwin \
            harness-dashboard-cli-x86_64-pc-windows-msvc.exe; do
            if ! grep -qxF "$asset" "$RUNNER_TEMP/names.txt"; then
              echo "::error::The release has no $asset"
              missing=1
            fi
          done
          exit "$missing"
      # install.sh / install.ps1 install nothing without a SHA-256 to compare against.
      - name: Build checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          rm -f "$assets/checksums.txt"
          (cd "$assets" && sha256sum -- * > checksums.txt)
          gh release upload "v$VERSION" "$assets/checksums.txt" --repo "$GITHUB_REPOSITORY" --clobber
      # Signed provenance for every asset: proof it was built here, from this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Publish the draft release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
